<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的 GitHub 项目</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f4f0e7;
    color: #2b2722;
    font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    width: min(1080px, 100%);
    margin: 0 auto;
    padding: 44px 22px 60px;
  }

  header {
    padding: 8px 4px 26px;
    border-bottom: 1px solid #ddd3c0;
  }

  header h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0;
  }

  header p {
    margin-top: 10px;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    color: #6f675c;
  }

  .grid {
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .card {
    display: block;
    background: #fffdf8;
    border: 1px solid #e2dac8;
    border-radius: 8px;
    padding: 18px 18px 16px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }

  .card:hover {
    border-color: #4d7860;
    box-shadow: 0 10px 24px rgba(43, 39, 34, .10);
    transform: translateY(-2px);
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .card h3 {
    font-size: 19px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .badge {
    flex: none;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    color: #3f7a5a;
    border: 1px solid #9cc2ab;
    border-radius: 999px;
    padding: 3px 8px;
  }

  .card p {
    margin-top: 10px;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.65;
    color: #6f675c;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card .link {
    display: inline-block;
    margin-top: 14px;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: #3f5d6b;
  }

  @media (max-width: 640px) {
    .page { padding: 28px 14px 40px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <main class="page">
    <header>
      <h1>我的 GitHub 项目</h1>
      <p>这里收录已部署上线的项目，点击可直接打开；以后新增部署会持续收录在这里。</p>
    </header>
    <section class="grid" id="list" aria-label="项目列表"></section>
  </main>

<script>
  // 以后新增部署项目时，在此数组顶部添加一行即可
  const PROJECTS = [
    { name: "quote-card", desc: "引文卡片生成器：输入问答，自动生成可分享的高清图片", url: "https://bianruijiang.github.io/quote-card/", live: true },
    { name: "school-bell-system", desc: "校园作息铃声系统：可编辑作息时间表、自动打铃", url: "https://bianruijiang.github.io/school-bell-system/", live: true },
    { name: "pomodoro-timer", desc: "番茄钟：专注计时工具", url: "https://bianruijiang.github.io/pomodoro-timer/", live: true }
  ];

  const list = document.getElementById("list");
  PROJECTS.forEach((p) => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = p.url;
    card.target = "_blank";
    card.rel = "noopener";
    card.innerHTML =
      '<div class="card-top"><h3>' + p.name + '</h3>' +
      (p.live ? '<span class="badge">在线</span>' : "") +
      '</div><p>' + (p.desc || "GitHub 项目") + '</p>' +
      '<span class="link">' + (p.live ? "打开网页" : "查看仓库") + ' →</span>';
    list.appendChild(card);
  });
</script>
</body>
</html>
